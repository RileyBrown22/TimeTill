<html lang="en">

<meta charset="utf-8">

<style>
  :root{
    --bg-1:#0a0b0d;
    --bg-2:#111318;
    --case-hi:#22262d;
    --case-lo:#15171c;
    --case-edge:#000000;
    --screen:#05060a;
    --screen-edge:#000000;
    --amber:#ffb15a;
    --amber-soft:#c67d31;
    --amber-glow:rgba(255,153,61,.55);
    --amber-deep:255,140,40;
    --text:#e9e6de;
    --text-dim:#868c96;
    --text-faint:#4d5158;
    --btn:#20242a;
    --btn-hi:#2a2f37;
    --btn-edge:#000000;
    --divider:#26292f;
    --focus:#ffb15a;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}

  body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
    background:
      radial-gradient(120% 100% at 50% 0%, var(--bg-2) 0%, var(--bg-1) 60%);
    font-family:'Sora', system-ui, -apple-system, sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  .clock{
    position:relative;
    width:min(440px, 100%);
    background:linear-gradient(160deg, var(--case-hi), var(--case-lo) 70%);
    border-radius:30px;
    padding:24px 24px 20px;
    box-shadow:
      0 40px 70px -30px rgba(0,0,0,.8),
      0 0 0 1px var(--case-edge);
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px 16px;
  }

  .brand{
    font-size:11px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .topbar-right{
    position:relative;
    display:flex;
    align-items:center;
    gap:9px;
  }

  .now-readout{
    font-family:'Digital Numbers', 'Sora', monospace;
    font-size:15px;
    letter-spacing:.04em;
    color:var(--text-dim);
    font-variant-numeric:tabular-nums;
  }

  .screen{
    position:relative;
    background:var(--screen);
    border-radius:16px;
    padding:26px 20px 20px;
    text-align:center;
    box-shadow:
      inset 0 3px 10px rgba(0,0,0,.9),
      inset 0 0 0 1px var(--screen-edge),
      inset 0 0 40px rgba(var(--amber-deep),.03);
    overflow:hidden;
  }

  .screen-label{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:10px;
  }

  .readout{
    font-family:'Digital Numbers', 'Sora', monospace;
    font-size:clamp(2.6rem, 13vw, 3.7rem);
    line-height:1;
    color:var(--amber);
    text-shadow:
      0 0 6px var(--amber-glow),
      0 0 22px var(--amber-glow),
      0 0 46px rgba(var(--amber-deep),.28);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .readout.is-empty{
    color:var(--text-faint);
    text-shadow:none;
  }

  .readout-sub{
    margin-top:10px;
    font-size:12.5px;
    color:var(--amber-soft);
    font-weight:500;
    letter-spacing:.03em;
    min-height:16px;
  }

  .fields{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:end;
    gap:10px;
    margin-top:18px;
  }

  .field{
    background:var(--btn);
    border-radius:12px;
    padding:10px 12px 8px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6), inset 0 0 0 1px var(--btn-edge);
  }

  .field label{
    display:block;
    font-size:10px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:6px;
  }

  .field input[type="time"]{
    width:100%;
    background:transparent;
    border:0;
    color:var(--text);
    font-family:'Digital Numbers', 'Sora', monospace;
    font-size:18px;
    font-variant-numeric:tabular-nums;
    color-scheme:dark;
    padding:0;
  }

  .field input[type="time"]:focus{
    outline:none;
  }

  .field:focus-within{
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6), inset 0 0 0 1px var(--focus);
  }

  .arrow{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    color:var(--text-faint);
    font-size:16px;
    padding-bottom:10px;
  }

  .presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }

  .chip{
    flex:1 1 auto;
    appearance:none;
    border:0;
    background:linear-gradient(180deg, var(--btn-hi), var(--btn));
    color:var(--text-dim);
    font-family:'Sora', sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    padding:9px 10px;
    border-radius:10px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 4px rgba(0,0,0,.4);
    cursor:pointer;
    transition:transform .08s ease, color .15s ease, background .15s ease;
  }

  .chip:hover{
    color:var(--amber);
    background:linear-gradient(180deg, #2e333b, #23272e);
  }

  .chip:active{
    transform:translateY(1px);
  }

  .chip:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .feet{
    display:flex;
    justify-content:space-between;
    padding:0 6px;
    margin-top:18px;
  }

  .feet span{
    width:34px;
    height:5px;
    border-radius:3px;
    background:linear-gradient(180deg, #000, #060708);
    box-shadow:0 1px 0 rgba(255,255,255,.04);
  }
</style>
</head>
<body>

<div class="clock">
  <div class="topbar">
    <span class="brand">TimeTill</span>
    <span class="topbar-right">
      <span class="now-readout" id="nowReadout">--:--:--</span>
    </span>
  </div>

  <div class="screen">
    <div class="screen-label">Time remaining</div>
    <div class="readout is-empty" id="readout">--:--</div>
    <div class="readout-sub" id="readoutSub"></div>
  </div>

  <div class="fields">
    <div class="field">
      <label for="fromTime">From</label>
      <input type="time" id="fromTime" step="60">
    </div>
    <div class="arrow" aria-hidden="true">&#8594;</div>
    <div class="field">
      <label for="toTime">Until</label>
      <input type="time" id="toTime" step="60">
    </div>
  </div>

  <div class="presets">
    <button class="chip" data-mins="15" type="button">+15m</button>
    <button class="chip" data-mins="30" type="button">+30m</button>
    <button class="chip" data-mins="60" type="button">+1h</button>
    <button class="chip" data-mins="120" type="button">+2h</button>
  </div>

  <div class="feet"><span></span><span></span></div>
</div>

</div>

<script>
  (function(){
    var fromInput = document.getElementById('fromTime');
    var toInput = document.getElementById('toTime');
    var readout = document.getElementById('readout');
    var readoutSub = document.getElementById('readoutSub');
    var nowReadout = document.getElementById('nowReadout');

    function pad(n){ return String(n).padStart(2, '0'); }

    function currentHM(){
      var d = new Date();
      return { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() };
    }

    function minsToHM(mins){
      return pad(Math.floor(mins / 60)) + ':' + pad(mins % 60);
    }

    function parseInputMinutes(el){
      var v = el.value;
      if(!v) return null;
      var parts = v.split(':');
      var h = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      if(isNaN(h) || isNaN(m)) return null;
      return h * 60 + m;
    }

    function showEmpty(msg){
      readout.textContent = '--:--';
      readout.classList.add('is-empty');
      readoutSub.textContent = msg || '';
    }

    function calculate(){
      var fromMins = parseInputMinutes(fromInput);
      var toMins = parseInputMinutes(toInput);

      if(fromMins === null || toMins === null){
        showEmpty();
        return;
      }

      var diff = toMins - fromMins;
      if(diff < 0){
        showEmpty('Until is earlier than From');
        return;
      }

      readout.classList.remove('is-empty');
      readout.textContent = minsToHM(diff);

      var hours = Math.floor(diff / 60);
      var minutes = diff % 60;
      var parts = [];
      if(hours > 0) parts.push(hours + (hours === 1 ? ' hour' : ' hours'));
      parts.push(minutes + (minutes === 1 ? ' minute' : ' minutes'));
      readoutSub.textContent = diff === 0 ? 'that\u2019s right now' : parts.join(', ') + ' \u00b7 ' + diff + ' min total';
    }

    function tickNow(){
      var now = currentHM();
      nowReadout.textContent = pad(now.h) + ':' + pad(now.m) + ':' + pad(now.s);
    }

    document.querySelectorAll('.chip[data-mins]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var fromMins = parseInputMinutes(fromInput);
        if(fromMins === null){
          var now = currentHM();
          fromMins = now.h * 60 + now.m;
          fromInput.value = pad(now.h) + ':' + pad(now.m);
        }
        var add = parseInt(btn.getAttribute('data-mins'), 10);
        toInput.value = minsToHM(fromMins + add);
        calculate();
      });
    });

    fromInput.addEventListener('input', calculate);
    toInput.addEventListener('input', calculate);

    var now = currentHM();
    fromInput.value = pad(now.h) + ':' + pad(now.m);
    calculate();
    tickNow();
    setInterval(tickNow, 1000);
  })();
</script>
</body>
</html>
